name: Report a problem
description: Bug reports and questions (takedowns and privacy concerns are reported privately)
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep SplitViewer safe.

        > [!WARNING]
        > **Issues are public.** Never post a share link (`…/p/<slug>`) here.
        > For takedown requests and privacy concerns, use
        > [private reporting](https://github.com/panz3r/splitviewer/security/advisories/new)
        > instead — see [SECURITY.md](https://github.com/panz3r/splitviewer/blob/main/SECURITY.md).

        Useful context:

        - **What is public**: public pages only ever show first names + last initials
          ("Marco P."), never emails, avatars, or full surnames. Share owners can
          revoke their own links instantly from the dashboard.
        - **Data storage**: Cloudflare D1 restricted to EU jurisdiction; OAuth
          tokens are AES-256-GCM encrypted at rest.
        - More details: the [in-app support page](https://splitviewer.mattiapanzeri.workers.dev/support).

        SplitViewer is not affiliated with Splitwise.

  - type: dropdown
    id: kind
    attributes:
      label: What is this report about?
      options:
        - Bug (something broken)
        - Question
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you saw, what you expected, and steps to reproduce for bugs. Please do NOT paste share links or private expense data.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where did you see it?
      description: The hosted instance or your self-hosted worker URL.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I understand SplitViewer is an independent open-source tool, not affiliated with Splitwise.
          required: true
        - label: I have not included share links or private data (emails, receipts, full surnames) in this report.
          required: true
