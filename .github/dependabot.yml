version: 2
updates:
  # npm dependencies: minor+patch grouped into one weekly PR (low noise),
  # majors surface individually for manual review. CI validates every PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # GitHub Actions used by ci/release/prep workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
