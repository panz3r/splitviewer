name: Secret scan

# Scans the full git history for committed secrets with betterleaks
# (https://github.com/betterleaks/betterleaks). The binary is a pinned release
# verified against a hardcoded SHA-256 — no third-party action involved. To
# bump: update BETTERLEAKS_VERSION and BETTERLEAKS_SHA256 (linux_x64 entry in
# the release's checksums.txt).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: 1.10.1
      BETTERLEAKS_SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false

      - name: Install betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" betterleaks
          "$RUNNER_TEMP/betterleaks" version

      # --redact keeps any finding's value out of the (public) job log.
      - name: Scan git history
        run: '"$RUNNER_TEMP/betterleaks" git . --redact --no-banner --verbose'
