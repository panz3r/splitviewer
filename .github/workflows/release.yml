name: Release

on:
  push:
    tags: ["v*"]
  # The Release-prep workflow dispatches this on the tag ref after bumping
  # package.json (GITHUB_TOKEN tag pushes don't trigger `on: push`).
  workflow_dispatch:

permissions:
  contents: write # GitHub Releases
  deployments: write # prod deployment records

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed local config + keys
        env:
          SPLITWISE_CLIENT_ID: ci-dummy-client-id
          SPLITWISE_CLIENT_SECRET: ci-dummy-client-secret
        run: bash scripts/setup-local.sh --yes

      - name: Typecheck (app + tests)
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p test/tsconfig.json

      - name: Tests (vitest + Cloudflare Workers pool)
        run: npm test

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # The `prod` environment powers the repo's Environments/Deployments UI and
    # can carry protection rules (required reviewers, wait timers).
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # wrangler.jsonc is gitignored by design — rebuild it for CI from the
      # committed template + repository secrets (deployment-specific values).
      # REPO_URL is injected from the GitHub repository itself, so forks get
      # in-app report links pointing at their own issue tracker.
      - name: Build wrangler.jsonc from secrets
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SPLITWISE_CLIENT_ID: ${{ secrets.SPLITWISE_CLIENT_ID }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sed -e "s/REPLACE_ME_DATABASE_ID/${D1_DATABASE_ID}/" \
              -e "s/REPLACE_ME_SPLITWISE_CLIENT_ID/${SPLITWISE_CLIENT_ID}/" \
              -e "s|https://github.com/panz3r/splitviewer|${REPO_URL}|" \
              wrangler.example.jsonc > wrangler.jsonc
          grep -q REPLACE_ME wrangler.jsonc && {
            echo "::error::D1_DATABASE_ID and SPLITWISE_CLIENT_ID secrets must be set"
            exit 1
          } || true

      # Open a prod deployment record (shows under the repo's Deployments view,
      # tied to the tag) and flip its status after the deploy finishes.
      - name: Create prod deployment record
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: "prod",
              description: "SplitViewer production deploy",
              auto_merge: false,
              required_contexts: [],
            });
            core.setOutput("id", String(data.id));
            core.setOutput("url", "https://splitviewer.mattiapanzeri.workers.dev");

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional: only needed if the API token can access multiple accounts
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish GitHub Release (generated notes)
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "SplitViewer $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mark prod deployment successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt("${{ steps.deployment.outputs.id }}", 10),
              state: "success",
              environment_url: "${{ steps.deployment.outputs.url }}",
              description: "Deployed from CI",
            });

      - name: Mark prod deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt("${{ steps.deployment.outputs.id }}", 10),
              state: "failure",
              description: "Deploy failed in CI",
            });

      # Safety net for manually-pushed tags: keep package.json in sync with the
      # released version. The Release-prep path tags a tree that already carries
      # the right version, so this is a no-op there.
      - name: Sync package.json version to the released tag
        if: success()
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json already at $VERSION — nothing to sync"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): sync package.json to v${VERSION}"
          git push origin HEAD:main
