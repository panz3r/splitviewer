name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual run (also used to verify pipeline changes)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No real credentials needed: seeds wrangler.jsonc (gitignored in the repo)
      # from the committed template and generates throwaway keys + dummy OAuth
      # credentials for .dev.vars (dummies keep /auth/login functional — the
      # route only refuses the literal REPLACE_ME placeholders).
      - name: Seed local config + keys
        env:
          SPLITWISE_CLIENT_ID: ci-dummy-client-id
          SPLITWISE_CLIENT_SECRET: ci-dummy-client-secret
        run: bash scripts/setup-local.sh --yes

      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck (tests)
        run: npx tsc --noEmit -p test/tsconfig.json

      - name: Tests (vitest + Cloudflare Workers pool)
        run: npm test

  # Auto-merge Dependabot PRs once the full check suite above is green.
  # Patch bumps merge automatically (devDependencies: minor + patch); runtime
  # minors and all majors stay for manual review — anything merged here ships
  # on the next release without a human looking at it.
  automerge:
    name: Auto-merge Dependabot PRs
    needs: checks
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.pull_request.head.repo.full_name
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the PR
      pull-requests: write # comment/approve on the PR
    steps:
      - uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash # the repo only allows squash merges
          target: patch # runtime + indirect deps: patch only
          target-development: minor # devDependencies: minor and patch
