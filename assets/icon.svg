<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="icon-shape">
      <rect x="16" y="16" width="480" height="480" rx="108" />
    </clipPath>
  </defs>

  <!-- Splitwise-inspired faceted geometric background -->
  <g clip-path="url(#icon-shape)">
    <!-- Top mint facet -->
    <polygon points="0,0 512,0 256,256" fill="#4EB497" />
    <!-- Left primary mint facet -->
    <polygon points="0,0 256,256 0,512" fill="#5BC5A7" />
    <!-- Right slate facet -->
    <polygon points="512,0 512,512 256,256" fill="#43484E" />
    <!-- Bottom charcoal facet -->
    <polygon points="0,512 256,256 512,512" fill="#373B3F" />
  </g>

  <!-- Centered geometric Eye replacing the Splitwise "S" -->
  <g>
    <path d="M 112 256 Q 256 116 400 256 Q 256 396 112 256 Z" fill="#23272A" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="32" stroke-linejoin="round" />
    <circle cx="256" cy="256" r="38" fill="#FFFFFF" />
  </g>
</svg>